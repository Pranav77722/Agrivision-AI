# Nixpacks configuration for Agrivision AI+ Python FastAPI backend on Voroa
providers = ["python"]

[phases.setup]
nixPkgs = ["python311", "gcc", "ffmpeg", "libGL"]

[phases.install]
cmds = ["python -m venv --copies .venv && . .venv/bin/activate && pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = ". .venv/bin/activate && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
